onedark_black="#282c34"
onedark_blue="#61afef"
onedark_yellow="#e5c07b"
onedark_red="#e06c75"
onedark_white="#aab2bf"
onedark_green="#98c379"
onedark_visual_grey="#3e4452"
onedark_comment_grey="#5c6370"

# Prefix
set -g prefix C-a
unbind C-b

# Input & behavior
set -g mouse on
set -g set-clipboard on
set -g escape-time 0
set -g mode-keys vi

# Terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Tc"

# Change from 0 based to 1 based because keyboard layout
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Status bar
set -g status-position bottom
set -g status-bg $onedark_black
set-option -g window-status-separator ""

# Left side: session name
set-option -g status-left-length 16
set-option -g status-left \
"#[fg=$onedark_black,bg=$onedark_green,bold] #S "

# Right side: time, date
set-option -g status-right \
"#[fg=$onedark_white,bg=$onedark_visual_grey,nobold,nounderscore,noitalics] %R \
#[fg=$onedark_black,bg=$onedark_green,bold] %d/%m/%Y "

# Window list
set-option -g window-status-format \
"#[fg=$onedark_white,bg=$onedark_comment_grey,nobold,nounderscore,noitalics] #I \
#[fg=$onedark_white,bg=$onedark_visual_grey] #W "

set-option -g window-status-current-format \
"#[fg=$onedark_black,bg=$onedark_yellow,bold,nounderscore,noitalics] #I \
#[fg=$onedark_yellow,bg=$onedark_visual_grey,bold] #W "

# Move between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+hjkl to switch panes (vim-style)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+number to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Resize panes
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Swap windows
bind < swap-window -t -
bind > swap-window -t +

# Open panes/windows in current directory
unbind %
bind v split-window -h -c "#{pane_current_path}"
unbind '"'
bind s split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"

# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Session & Tree
bind S choose-session
bind T choose-tree

# Vim-like copy/paste
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane
